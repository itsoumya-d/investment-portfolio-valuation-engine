name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Python Unit Tests & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Smoke test import
        run: python -c "import src; print('Smoke test OK')"
